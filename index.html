<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Consulta de ponencias de los Congresos de Historia de la Fotografía">
<title>Congresos de Historia de la Fotografía</title>
<style>
:root{--bg:#f4f2ed;--paper:#fff;--ink:#252525;--muted:#6b6a66;--line:#d9d5cc;--accent:#7c2f31;--shadow:0 2px 12px rgba(0,0,0,.055)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
header{background:#262624;color:#fff;padding:24px 18px 22px}.wrap{max-width:1100px;margin:0 auto}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.08;font-weight:500;margin:0}
.controls{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.04)}.controls .wrap{padding:14px 18px}.searchrow{display:flex;gap:10px;align-items:center}
#q{width:100%;font-size:1.08rem;padding:13px 15px;border:1px solid #aaa69e;border-radius:8px;background:#fff;color:var(--ink);outline:none}#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,47,49,.12)}
button{font:inherit}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.filter,.viewbtn{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;cursor:pointer;color:#333;transition:.12s ease}.filter.active[data-c="all"],.viewbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}.filter[data-c]:not([data-c="all"]){border-color:var(--cc);color:var(--cc)}.filter.active[data-c]:not([data-c="all"]){background:var(--cc);color:#fff}
.main{padding:26px 18px 60px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}#count{font-weight:650}.views{display:flex;gap:7px;flex-wrap:wrap}
.record{display:grid;grid-template-columns:130px 1fr;gap:0;margin:0 0 12px;align-items:stretch}.tab{background:var(--cc);border-radius:11px 0 0 11px;padding:13px 12px;color:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}.tab .cn{font-weight:750;font-size:.97rem;line-height:1.1}.tab .yr{font-size:.85rem;opacity:.9}.tab .pg{font-size:.89rem;line-height:1.2;margin-top:auto}.article{background:var(--paper);border:1px solid var(--line);border-left:0;border-radius:0 11px 11px 0;padding:16px 18px;box-shadow:var(--shadow)}
.headrow{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.cardtitle{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:1.28rem;line-height:1.22;margin:0}.catalogbtn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:48px;padding:5px 9px;border:1px solid var(--cc);border-radius:999px;color:var(--cc);text-decoration:none;font-size:.82rem;font-weight:750;background:#fff}.catalogbtn:hover{background:#f8f7f3}.authors{font-size:.98rem;margin:8px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0}.tag{border:0;background:#edf0ee;border-radius:999px;padding:4px 8px;cursor:pointer;font-size:.79rem;text-align:left;color:#39403c}.tag:hover{background:#dde4df}
details{margin-top:10px;border-top:1px solid #ece9e3;padding-top:8px}summary{cursor:pointer;color:var(--accent);font-weight:650;user-select:none;font-size:.93rem}.detailgrid{margin-top:9px;font-size:.91rem}.detailgrid p{margin:6px 0}.label{font-weight:700}
.indexbox{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}.indexitem{border-bottom:1px solid #ece9e3}.indexitem:last-child{border-bottom:0}.indexitem button{display:flex;width:100%;justify-content:space-between;gap:15px;border:0;background:#fff;text-align:left;padding:11px 14px;cursor:pointer;color:var(--ink)}.indexitem button:hover{background:#f8f7f3}.badge{white-space:nowrap;color:var(--muted)}
.empty,.loading{background:#fff;border:1px dashed #bbb6ac;padding:30px;border-radius:10px;text-align:center;color:var(--muted)}.help{font-size:.84rem;color:var(--muted);margin-top:7px}footer{border-top:1px solid var(--line);padding:20px 18px 36px;color:var(--muted);font-size:.84rem}
@media(max-width:800px){.record{grid-template-columns:1fr}.tab{border-radius:11px 11px 0 0;flex-direction:row;align-items:center;justify-content:space-between}.tab .pg{margin-top:0}.article{border-left:1px solid var(--line);border-top:0;border-radius:0 0 11px 11px}}
@media(max-width:650px){header{padding-top:24px}.controls{position:static}.article{padding:14px}.views{width:100%}.viewbtn{flex:1}.headrow{gap:8px}.cardtitle{font-size:1.16rem}}
@media print{.controls,.views,.help,footer,.catalogbtn{display:none!important}body{background:#fff}.article,.tab{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Congresos de Historia de la Fotografía</h1></div></header>
<div class="controls"><div class="wrap"><div class="searchrow"><input id="q" type="search" autocomplete="off" placeholder="Buscar por autor, título o tema…" aria-label="Buscar ponencias"></div><div class="filters" id="filters"></div></div></div>
<main class="main wrap"><div class="toolbar"><div><span id="count"></span><div class="help" id="hint"></div></div><div class="views" aria-label="Modo de consulta"><button class="viewbtn active" data-v="records">Ponencias</button><button class="viewbtn" data-v="authors">Autores</button><button class="viewbtn" data-v="subjects">Temas</button></div></div><section id="results" aria-live="polite"><div class="loading">Cargando datos…</div></section></main>
<footer><div class="wrap">Datos generados automáticamente a partir del secuencial de Aleph.</div></footer>
<script>window.DATA=[];window.SUBJECTS={};</script>
<script src="data1.js"></script><script src="data2.js"></script><script src="data3.js"></script><script src="data4.js"></script><script src="data5.js"></script>
<script src="subjects1.js"></script><script src="subjects2.js"></script><script src="subjects3.js"></script><script src="subjects4.js"></script><script src="subjects5.js"></script>
<script>
const COLORS=['#8b3a3e','#4d6b8a','#5f7c49','#8a6a3f','#6b5a91','#3f7b78','#9a5f3b','#706a48'];
let DATA=window.DATA;DATA.forEach(r=>{r.subjects=(window.SUBJECTS&&window.SUBJECTS[r.id])||r.subjects||[]});let congress='all',view='records',selection=null;
const q=document.getElementById('q'),results=document.getElementById('results'),count=document.getElementById('count'),hint=document.getElementById('hint'),filters=document.getElementById('filters');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const colorFor=n=>COLORS[(Math.max(1,Number(n)||1)-1)%COLORS.length];
const bnUrl=id=>`https://catalogo.bn.gov.ar/F/?func=direct&doc_number=${String(id).padStart(9,'0')}&local_base=GENER`;
function buildCongressButtons(){const cs=[...new Set(DATA.map(r=>r.congressNo).filter(Boolean))].sort((a,b)=>a-b);filters.innerHTML=`<button class="filter active" data-c="all">Todos · ${DATA.length}</button>`+cs.map(c=>{const n=DATA.filter(r=>r.congressNo===c).length;return `<button class="filter" data-c="${c}" style="--cc:${colorFor(c)}">${c}.º Congreso · ${n}</button>`}).join('');filters.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{q.value='';selection=null;congress=b.dataset.c;view='records';syncFilters();syncViews();render();}));}
function syncFilters(){document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.c===congress));}function syncViews(){document.querySelectorAll('.viewbtn').forEach(b=>b.classList.toggle('active',b.dataset.v===view));}
function searchRows(term){const t=norm(term);if(!t)return DATA;return DATA.filter(r=>norm([r.title,r.statement,...r.authors,...r.subjects,...r.contents,...r.alternateTitles,r.congress,r.pages].join(' ')).includes(t));}
function recordRows(){if(selection){return selection.kind==='authors'?DATA.filter(r=>r.authors.includes(selection.name)):DATA.filter(r=>r.subjects.includes(selection.name));}const term=q.value.trim();if(term)return searchRows(term);if(congress!=='all')return DATA.filter(r=>String(r.congressNo)===congress);return DATA;}
function chooseSelection(kind,name){q.value='';congress='all';selection={kind,name};view='records';syncFilters();syncViews();render();window.scrollTo({top:0,behavior:'smooth'});}
function renderRecords(rows){count.textContent=`${rows.length} ${rows.length===1?'ponencia':'ponencias'}`;if(selection){hint.textContent=selection.kind==='authors'?`Ponencias de ${selection.name}.`:`Ponencias relacionadas con ${selection.name}.`;}else if(congress!=='all'){hint.textContent=`Contenido completo del ${congress}.º Congreso.`;}else if(q.value.trim()){hint.textContent=`Resultados de búsqueda en ${DATA.length} registros.`;}else{hint.textContent='Podés tocar cualquier materia para ver ponencias relacionadas.';}if(!rows.length){results.innerHTML='<div class="empty">No se encontraron resultados.</div>';return;}results.innerHTML=rows.map(r=>`<article class="record" style="--cc:${colorFor(r.congressNo)}"><div class="tab"><div class="cn">${r.congressNo}.º Congreso</div><div class="yr">${r.year||''}</div><div class="pg">${esc(r.pages||'')}</div></div><div class="article"><div class="headrow"><h2 class="cardtitle">${esc(r.title)}</h2><a class="catalogbtn" href="${bnUrl(r.id)}" target="_blank" rel="noopener noreferrer" title="Ver registro en catálogo BN">BN ↗</a></div><div class="authors">${r.authors.length?esc(r.authors.join(' · ')):'Autor no consignado'}</div>${r.subjects.length?`<div class="tags">${r.subjects.map(s=>`<button class="tag" data-subject="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}<details><summary>Ver detalle</summary><div class="detailgrid">${r.alternateTitles.length?`<p><span class="label">Otros títulos:</span> ${esc(r.alternateTitles.join(' · '))}</p>`:''}${r.contents.length?`<p><span class="label">Contenido:</span> ${esc(r.contents.join(' · '))}</p>`:''}${r.bibliography.length?`<p><span class="label">Bibliografía:</span> ${esc(r.bibliography.join(' · '))}</p>`:''}${r.notes.length?`<p><span class="label">Notas:</span> ${esc(r.notes.join(' · '))}</p>`:''}<p><span class="label">Publicado en:</span> ${esc(r.hostTitle)}${r.pages?' · '+esc(r.pages):''}</p><p><span class="label">N.º de sistema:</span> ${esc(r.id)}</p></div></details></div></article>`).join('');results.querySelectorAll('[data-subject]').forEach(b=>b.addEventListener('click',()=>chooseSelection('subjects',b.dataset.subject)));}
function renderIndex(kind){const map=new Map();if(kind==='authors')DATA.forEach(r=>r.authors.forEach(v=>map.set(v,(map.get(v)||0)+1)));else DATA.forEach(r=>r.subjects.forEach(v=>map.set(v,(map.get(v)||0)+1)));const arr=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'es',{sensitivity:'base'}));count.textContent=`${arr.length} ${kind==='authors'?'autores':'temas'}`;hint.textContent=`Índice global. Tocá un ${kind==='authors'?'autor':'tema'} para ver sus ponencias.`;results.innerHTML='<div class="indexbox">'+arr.map(([name,n])=>`<div class="indexitem"><button data-index="${esc(name)}"><span>${esc(name)}</span><span class="badge">${n} ${n===1?'ponencia':'ponencias'}</span></button></div>`).join('')+'</div>';results.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>chooseSelection(kind,b.dataset.index)));}
function render(){view==='records'?renderRecords(recordRows()):renderIndex(view);}
q.addEventListener('input',()=>{congress='all';selection=null;view='records';syncFilters();syncViews();render();});document.querySelectorAll('.viewbtn').forEach(b=>b.addEventListener('click',()=>{congress='all';q.value='';selection=null;view=b.dataset.v;syncFilters();syncViews();render();}));
buildCongressButtons();render();
</script>
</body></html>
