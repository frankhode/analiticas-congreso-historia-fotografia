name: Actualizar datos desde Aleph
on:
  push:
    branches: [main]
    paths:
      - 'fuente/secuencial.txt'
      - 'scripts/**'
      - '.github/workflows/actualizar-datos.yml'
  workflow_dispatch:
concurrency:
  group: actualizar-catalogo
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar importador
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Acumular y procesar secuencial
        run: python scripts/procesar_secuencial.py fuente/secuencial.txt . --master fuente/acumulado.txt
      - name: Guardar salida
        run: |
          git add fuente/acumulado.txt data*.js subjects*.js datos/resumen.json
          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar catálogo desde Aleph"
          git push
